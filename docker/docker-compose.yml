version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: spss_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: spss_postgres
    environment:
      POSTGRES_USER: spss_user
      POSTGRES_PASSWORD: spss_password
      POSTGRES_DB: spss_db
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: spss_api
    command: uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://spss_user:spss_password@postgres:5432/spss_db
    depends_on:
      - redis
      - postgres
    volumes:
      - ../services:/app/services

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: spss_worker
    command: celery -A services.worker.app.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://spss_user:spss_password@postgres:5432/spss_db
    depends_on:
      - redis
      - postgres
    volumes:
      - ../services:/app/services
      - shared_data:/tmp/datasets

volumes:
  shared_data:
  postgres_data:
